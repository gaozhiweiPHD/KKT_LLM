[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kkt-qwen-agent"
version = "0.1.0"
description = "KKT-verified active-set repair with Qwen3 LoRA and multi-turn GRPO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.15", "osqp>=1.0"]
[project.optional-dependencies]
dev = ["pytest>=8"]
analysis = ["pandas>=2.2", "matplotlib>=3.9", "PyYAML>=6"]
train = ["torch==2.8.0", "trl==1.16.0", "transformers>=5.2.0,<6", "peft>=0.17", "accelerate>=1.4", "datasets>=4", "PyYAML>=6"]
[project.urls]
Repository = "https://github.com/gaozhiweiPHD/KKT_LLM"
[tool.setuptools.packages.find]
include = ["kkt_agent*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
